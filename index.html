<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Moon Lit</title>
  <meta name="description" content="A lantern-festival bubble shooter — match colors, drop chains, watch the moon move the sky.">
  <meta name="theme-color" content="#0E1538">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="img/favicon-32.png" type="image/png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Moon-lit registers its own service worker (sw.js, at the bottom of
    // <body>) but never on loopback. On a dev origin, though, a SW from the
    // launcher (or a sibling game's `./ago`) may still be registered from an
    // earlier session and intercept fetches. Wipe it on every loopback
    // load so dev sessions stay self-healing. Loopback-only: getRegistrations()/
    // caches are origin-scoped, so doing this in production would also unregister
    // the launcher's own service worker and delete its caches.
    // try/catch, not just the `in` check: this runs BEFORE the Arcade SDK
    // loads, and in a launcher-sandboxed (opaque-origin) frame the
    // navigator.serviceWorker GETTER itself throws SecurityError — no SW
    // can control such a frame anyway, so there is nothing to wipe there.
    try {
      var isLoopback = ['localhost', '127.0.0.1', '::1'].includes(location.hostname) ||
        location.hostname.startsWith('127.');
      if (isLoopback && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(rs => rs.forEach(r => r.unregister()))
          .catch(() => {});
        if (window.caches) {
          caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
        }
      }
    } catch (e) {
      // Expected inside the launcher's sandboxed dev frames (the
      // serviceWorker getter throws there); logged, not swallowed, so
      // anything unexpected still surfaces.
      console.info('[moon-lit] dev SW wipe skipped:', e.message);
    }
  </script>
  <script src="/arcade-sdk.js"></script>
  <script>Arcade.init({ gameId: 'moon-lit' });</script>
  <!-- SDK companion: the physical-gesture element library that lights up
       Arcade.audio.graph(). If it 404s (standalone, or a stale cache),
       js/sfx.js registers nothing and the game plays silent — by design. -->
  <script src="/arcade-audio.js"></script>
  <!-- The moon-lit sound pack. Plain script, must load before js/main.js. -->
  <script src="js/soundpack.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="js/main.js"></script>
  <script>
  // Offline support (fleet SW standard — see sw.js's header). The loopback
  // guard keeps local-dev edits from being masked by stale cache, matching
  // the launcher's own behavior. Fire-and-forget with a .catch: inside a
  // launcher frame the SDK shims navigator.serviceWorker with an inert stub
  // whose register() rejects.
  if ('serviceWorker' in navigator &&
      !/^(127\.|localhost$|0\.0\.0\.0$|::1$)/.test(location.hostname)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('sw.js', { scope: '/moon-lit/' })
        .catch(function () {}); // offline just won't work; the game still does
    });
  }
  </script>
</body>
</html>
